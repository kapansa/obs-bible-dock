<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Verse Overlay Pro</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Crimson+Text:ital,wght@0,600;1,400&family=EB+Garamond:ital,wght@0,500;1,400&family=Inter:wght@400;600&family=Lora:ital,wght@0,500;1,400&family=Open+Sans:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <div id="overlay-wrapper" class="position-bottom">
    <div id="verse-container" class="verse-container hidden anim-fade">
      <blockquote id="verse-text" class="verse-text"></blockquote>
      <div id="verse-reference" class="verse-reference"></div>
    </div>
  </div>

  <script src="js/overlay.js"></script>
</body>
</html>
