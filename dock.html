<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Verse Controller</title>
  <link rel="stylesheet" href="css/dock.css">
</head>
<body>
  <div class="dock-container">
    <header class="dock-header">
      <h2>Bible Verse Dock</h2>
    </header>

    <form id="search-form" class="search-form">
      <div class="form-group">
        <input 
          type="text" 
          id="verse-input" 
          placeholder="e.g. John 3:16 or Genesis 1:1-3" 
          required 
          autocomplete="off"
        />
      </div>

      <div class="form-row">
        <select id="version-select">
          <option value="kjv" selected>KJV (King James)</option>
          <option value="web">WEB (World English)</option>
          <option value="bbe">BBE (Bible in Basic English)</option>
          <option value="almeida">Almeida (Portuguese)</option>
        </select>
        <button type="submit" id="fetch-btn">Fetch</button>
      </div>
    </form>

    <div id="preview-card" class="preview-card hidden">
      <div class="preview-meta">
        <span id="preview-reference">John 3:16</span>
        <span id="preview-translation">KJV</span>
      </div>
      <p id="preview-text" class="preview-text">For God so loved the world...</p>
      
      <div class="action-buttons">
        <button id="show-btn" class="btn btn-primary">Project to Stream</button>
        <button id="hide-btn" class="btn btn-danger">Clear Screen</button>
      </div>
    </div>

    <div id="status-message" class="status-message"></div>
  </div>

  <script src="js/dock.js"></script>
</body>
</html>
